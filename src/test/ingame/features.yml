# Feature → files map for the in-game test suites (src/test/ingame/<feature>/*.json).
#
# A change runs the suites of every feature whose globs match a changed file
# (resolved by .claude/hooks/affected-features.mjs, same tool as ../hatlas).
# Glob syntax: `**` = any number of directories, `*` = anything except `/`, `?` = one char.
# Add a feature here (link, ticket-gate, expiry, presence…) when its code lands.

# Files that every feature depends on: touching one runs ALL suites.
shared:
  - src/main/java/org/minecraft/hatlas/proxy/HatlasProxy.java
  - src/main/java/org/minecraft/hatlas/proxy/config/**
  - src/main/resources/config.yml
  - scripts/test-stack.ps1
  - scripts/test-stack/**
  - build.gradle*
  - settings.gradle*
  - src/main/java/org/minecraft/hatlas/proxy/db/**
  - src/main/java/org/minecraft/hatlas/proxy/message/**
  - src/main/resources/db/**

features:
  # A player joining the network lands on the hub, through the proxy.
  routing:
    - scripts/test-stack/velocity.toml

  # /link on the hub: single-use code written to web.link_codes, cooldown, hub only.
  link:
    - src/main/java/org/minecraft/hatlas/proxy/link/**
    # link-off-hub-refused needs to reach the faction server, so it depends on the gate too.
    - src/main/java/org/minecraft/hatlas/proxy/access/**

  # Ticket gate hub -> faction (web.tickets), mid-session expiry warning and return to the hub.
  access:
    - src/main/java/org/minecraft/hatlas/proxy/access/**
    - scripts/test-stack/web-tickets.sql

  # Whole access chain with the real Hatlas on the faction backend (test-stack.ps1 hatlas on).
  # Run every suite in that mode.
  chain:
    - src/main/java/org/minecraft/hatlas/proxy/access/**
    - src/main/java/org/minecraft/hatlas/proxy/link/**
    - scripts/test-stack/hatlas-config.yml
